name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Reference and original tests
        run: python -m unittest discover -s tests -v
      - name: Grade the reference solutions
        run: python -m labs.retrieval.check --impl reference
      - name: Run the demonstration
        run: python -m labs.retrieval.demo
      - name: Verify the self-contained notebook
        run: python scripts/verify_notebook.py
